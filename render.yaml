services:
  - type: web_service
    name: woman-app
    env: docker
    plan: starter
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "5000"
      - key: DB_HOST
        value: "<RENDER_DB_HOST>"
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: "<RENDER_DB_USER>"
      - key: DB_PASSWORD
        value: "<RENDER_DB_PASSWORD>"
      - key: DB_NAME
        value: "woman_db"
      - key: JWT_SECRET
        value: "<REPLACE_WITH_SECURE_JWT_SECRET>"
      - key: ALLOWED_ORIGIN
        value: "*"

databases:
  - name: woman-mysql
    engine: mysql
    version: "8"
    plan: starter
    