services:
  # 1. Backend Service
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_storage:/app/storage
    depends_on:
      - db
    restart: always

  # 2. Frontend Service
  frontend:
    build:
      context: ./frontend
    ports:
      - "3001:80"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always

  # 3. Database Service
  db:
    image: mysql:8.0
    restart: no
    env_file:
      - ./backend/.env
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  db_data:
  backend_storage: