<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - SMSi</title>

<link rel="stylesheet" href="styles/global.css">
</head>

<body>

<div class="auth-shell">

  <!-- LEFT -->
  <section class="auth-left">
    <div class="auth-brand">
      <h1>SMSi</h1>
      <p>Password recovery and account access</p>
    </div>
  </section>

  <!-- RIGHT -->
  <section class="auth-right">
    <div class="auth-panel-card">

      <div class="auth-icon-badge">🔒</div>

      <h2 class="auth-title">Forgot Password</h2>
      <p class="auth-subtitle">
        Enter your email address and we will send you a reset link.
      </p>

      <form id="forgotForm">

        <div class="auth-field">
          <label class="auth-label">Email Address</label>
          <input class="auth-input" id="email" type="email" required>
        </div>

        <button class="auth-btn" type="submit">Send Reset Link</button>

        <div id="msg" class="auth-message"></div>

      </form>

      <div class="auth-footer">
        <a href="login.html" class="auth-link">← Back to Login</a>
      </div>

    </div>
  </section>

</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', (e) => {
  e.preventDefault();

  // No backend endpoint yet → simulate success
  document.getElementById('msg').style.color = 'green';
  document.getElementById('msg').textContent =
    'Reset link sent (mock). Check your email.';
});
</script>

</body>
</html>
