<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - SMSi</title>

<link rel="stylesheet" href="styles/global.css">
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js" defer></script>
</head>

<body>

<div class="auth-shell">

  <section class="auth-left">
    <div class="auth-brand">
      <h1>SMSi</h1>
      <p>Password recovery and account access</p>
    </div>
  </section>

  <section class="auth-right">
    <div class="auth-panel-card">

      <div class="auth-icon-badge">
        <svg class="ui-icon" aria-hidden="true"><use href="#ic-mail"></use></svg>
      </div>

      <h2 class="auth-title">Forgot Password</h2>
      <p class="auth-subtitle">
        Enter your email address and we will send you a reset link.
      </p>

      <form id="forgotForm">

        <div class="auth-field">
          <label class="auth-label">Email Address</label>
          <input class="auth-input" id="email" type="email" required>
        </div>

        <button class="auth-btn" type="submit">Send Reset Link</button>

        <div id="msg" class="auth-message"></div>
        <div id="resetLinkWrap" class="auth-footer" hidden>
          <a id="resetLink" class="auth-link" href="#">Open reset form</a>
        </div>

      </form>

      <div class="auth-footer">
        <a href="login.html" class="auth-link">Back to Login</a>
      </div>

    </div>
  </section>

</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim().toLowerCase();
  const msg = document.getElementById('msg');
  const button = e.submitter;

  msg.textContent = '';
  msg.style.color = '';
  button.disabled = true;
  button.textContent = 'Sending...';

  try {
    const res = await forgotPassword(email);

    if (!res?.success) {
      msg.textContent = res?.message || 'Unable to send reset link. Please try again.';
      msg.style.color = 'red';
    } else {
      msg.innerHTML = `
        <div style="padding: 14px; border-radius: 6px; background: #f0f4f8; border-left: 4px solid #1f5fbf; color: #111827;">
          <strong>Reset link sent</strong><br>
          <span style="font-size: 13px;">If the email exists in our system, a password reset link has been sent.</span>
        </div>
      `;
      msg.style.display = 'block';
      msg.style.color = '#111827';
      e.target.reset();
    }
  } catch (err) {
    console.error('Forgot password request failed:', err);
    msg.textContent = 'Unable to send reset link. Please try again later.';
    msg.style.color = 'red';
  } finally {
    button.disabled = false;
    button.textContent = 'Send Reset Link';
  }
});
</script>

</body>
</html>
