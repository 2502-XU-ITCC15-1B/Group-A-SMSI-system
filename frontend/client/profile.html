<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Client Profile</title>
  <link rel="stylesheet" href="/styles/global.css">
</head>
<body>
  <div class="app-shell" id="shell"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    AppSession.requireRole(['client']);

    document.getElementById('shell').innerHTML = `
      ${AppLayout.sidebar('client', 'Profile')}
      <div class="main">
        ${AppLayout.topbar(['Home', 'Profile'])}
        <div class="content">
          <section class="card">
            <h1>Profile Settings</h1>
            <p style="color:var(--muted)">Manage your personal information and account security.</p>
          </section>

          <div class="grid-3" style="grid-template-columns:2fr 1fr;gap:16px;margin-top:16px">
            <section class="card">
              <h2>Personal Information</h2>
              <form id="profileForm">
                <div class="form-row" style="margin-top:12px">
                  <div class="field">
                    <label>Full Name</label>
                    <input name="name" id="name" required>
                  </div>
                  <div class="field">
                    <label>Email Address</label>
                    <input name="email" id="email" type="email" required>
                  </div>
                </div>
                <button class="btn" type="submit" style="margin-top:12px">Save Changes</button>
              </form>

              <hr style="margin:20px 0;border:none;border-top:1px solid var(--line)">

              <h2>Security</h2>
              <form id="passwordForm">
                <div class="form-row" style="margin-top:12px">
                  <div class="field">
                    <label>Current Password</label>
                    <input name="current_password" type="password" required>
                  </div>
                  <div class="field">
                    <label>New Password</label>
                    <input name="new_password" type="password" required>
                  </div>
                </div>
                <button class="btn secondary" type="submit" style="margin-top:12px">Update Password</button>
              </form>
            </section>

            <aside class="card">
              <h2>Account Details</h2>
              <div id="accountMeta" style="color:var(--muted)"></div>
            </aside>
          </div>
        </div>
      </div>
    `;

    (async () => {
      const me = (await AppApi.auth.me()).user;
      document.getElementById('name').value = me.name || '';
      document.getElementById('email').value = me.email || '';
      document.getElementById('accountMeta').innerHTML = `
        <p><strong>Role:</strong> ${me.role}</p>
        <p><strong>Company:</strong> ${me.company_name || '-'}</p>
      `;
    })();

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = Object.fromEntries(new FormData(e.target).entries());
      alert('Profile update endpoint should be wired to PUT /api/users/me in the next backend pass.');
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      alert('Password update should be wired to the auth/profile endpoint in the next backend pass.');
    });
  </script>
</body>
</html>
