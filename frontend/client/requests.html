<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Requests</title>
  <link rel="stylesheet" href="/styles/global.css">
</head>
<body>
  <div class="app-shell">
    <div data-client-sidebar></div>

    <div class="main">
      <div data-client-topbar></div>

      <main class="content stack">
        <section class="card stack">
          <div class="toolbar">
            <div class="field">
              <label for="statusFilter">Status</label>
              <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="Open">Open</option>
                <option value="Assigned">Assigned</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
                <option value="Closed">Closed</option>
              </select>
            </div>

            <div class="field">
              <label for="priorityFilter">Priority</label>
              <select id="priorityFilter">
                <option value="">All Priorities</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Work Order</th>
                  <th>Title</th>
                  <th>Status</th>
                  <th>Priority</th>
                  <th>Submitted</th>
                </tr>
              </thead>
              <tbody id="requestsTableBody">
                <tr>
                  <td colspan="5" class="table-empty">Loading requests...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination">
            <button class="btn secondary" id="prevBtn" type="button">Previous</button>
            <span class="pagination-info" id="pageInfo">Page 1 of 1</span>
            <button class="btn secondary" id="nextBtn" type="button">Next</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/client.js"></script>
  <script src="/client/my-requests.js"></script>
</body>
</html>
