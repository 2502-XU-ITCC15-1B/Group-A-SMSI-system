<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity</title>
  <link rel="stylesheet" href="../styles/global.css">
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="./common.js"></script>
  <script src="./activity.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="../assets/logo.png" alt="SMSi">
        <div>
          <strong>SMSi</strong>
          <span id="portalLabel">technician portal</span>
        </div>
      </div>

      <nav>
        <a class="nav-item" data-nav="dashboard" href="/technician/dashboard.html">Dashboard</a>
        <a class="nav-item" data-nav="tickets" href="/technician/tickets.html">Tickets</a>
        <a class="nav-item active" data-nav="activity" href="/technician/activity.html">Activity</a>
        <a class="nav-item" data-nav="profile" href="/technician/profile.html">Profile</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-label">Signed in as</div>
        <div class="sidebar-user" id="sessionUserName">Loading...</div>
        <div class="sidebar-company" id="sessionUserMeta">Loading...</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-meta">
          <nav class="breadcrumbs">
            <span class="crumb">Operations</span>
            <span class="crumb current">Activity</span>
          </nav>
          <div>
            <h1 class="page-title" id="pageTitle">Activity Timeline</h1>
            <p class="page-subtitle" id="pageSubtitle">Loading ticket activity...</p>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="search-input">
            <input id="searchInput" type="search" placeholder="Search ticket activity">
          </div>
          <button class="btn secondary" id="refreshBtn" type="button">Refresh</button>
        </div>
      </header>

      <main class="content stack">
        <p id="activityMessage" class="form-msg" aria-live="polite"></p>

        <section class="card">
          <div class="toolbar">
            <button class="btn secondary filter-btn active" data-filter="all" type="button">All</button>
            <button class="btn secondary filter-btn" data-filter="response" type="button">Responses</button>
            <button class="btn secondary filter-btn" data-filter="internal" type="button">Internal Notes</button>
            <button class="btn secondary filter-btn" data-filter="log" type="button">System Logs</button>
          </div>
        </section>

        <section id="timelineContainer" class="stack">
          <div class="empty-state">Loading activity...</div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
