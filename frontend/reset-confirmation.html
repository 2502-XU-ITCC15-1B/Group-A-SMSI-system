<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Updated - SMSi</title>

<link rel="stylesheet" href="styles/global.css">
</head>

<body>

<div class="auth-shell">

  <!-- LEFT -->
  <section class="auth-left">
    <div class="auth-brand">
      <h1>SMSi</h1>
      <p>Account security and verification</p>
    </div>
  </section>

  <!-- RIGHT -->
  <section class="auth-right">
    <div class="auth-panel-card" style="text-align:center">

      <div class="auth-icon-badge">✔</div>

      <h2 class="auth-title">Password Updated</h2>
      <p class="auth-subtitle">
        Your password has been successfully reset. You may now log in.
      </p>

      <button class="auth-btn" onclick="window.location.href='login.html'">
        Back to Login
      </button>

    </div>
  </section>

</div>

</body>
</html>
