<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Activity Timeline</title>

<link rel="stylesheet" href="../styles/global.css" />

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="./activity.js" defer></script>
</head>

<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <strong>Service Desk</strong>
      <span>Head Technician Portal</span>
    </div>

    <nav>
      <a class="nav-item" href="dashboard.html">Dashboard</a>
      <a class="nav-item" href="tickets.html">Tickets</a>
      <a class="nav-item active">Activity</a>
      <a class="nav-item" href="profile.html">Profile</a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-label">Logged in as</div>
      <div class="sidebar-user" id="userName"></div>
      <div class="sidebar-company" id="userDept"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-meta">
        <div class="breadcrumbs">
          <span class="crumb">Home</span>
          <span class="crumb current">Activity</span>
        </div>

        <h1 class="page-title">Activity Timeline</h1>
        <p class="page-subtitle">
          Department-wide activity logs, responses, and ticket updates
        </p>
      </div>

      <div class="topbar-actions">
        <input
          id="searchInput"
          class="auth-input"
          placeholder="Search activity..."
          style="width:240px"
        />
        <button class="btn secondary" id="refreshBtn">Refresh</button>
      </div>

    </div>

    <!-- CONTENT -->
    <div class="content stack">

      <!-- FILTERS -->
      <div class="card">
        <div class="toolbar" style="grid-template-columns:auto auto auto auto;">
          <button class="btn secondary filter-btn active" data-filter="all">All</button>
          <button class="btn secondary filter-btn" data-filter="status">Status Changes</button>
          <button class="btn secondary filter-btn" data-filter="assign">Assignments</button>
          <button class="btn secondary filter-btn" data-filter="response">Responses</button>
        </div>
      </div>

      <!-- TIMELINE -->
      <div id="timelineContainer" class="stack"></div>

    </div>

  </div>
</div>

</body>
</html>
