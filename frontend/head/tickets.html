<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Department Tickets</title>

<link rel="stylesheet" href="../styles/global.css"/>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="./tickets.js" defer></script>
</head>

<body>

<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <strong>Service Desk</strong>
      <span>Head Technician Portal</span>
    </div>

    <nav>
      <a class="nav-item">Dashboard</a>
      <a class="nav-item active">Tickets</a>
      <a class="nav-item">Activity</a>
      <a class="nav-item">Profile</a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user-label">Head Technician</div>
      <div class="sidebar-user" id="userName"></div>
      <div class="sidebar-company" id="userDept"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">

      <div class="topbar-meta">
        <div class="breadcrumbs">
          <span class="crumb">Home</span>
          <span class="crumb current">Tickets</span>
        </div>

        <div>
          <h1 class="page-title">Department Tickets</h1>
          <p class="page-subtitle">
            Managing all active and pending service requests
          </p>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="btn secondary" id="refreshBtn">Refresh</button>
      </div>

    </div>

    <!-- CONTENT -->
    <div class="content stack">

      <!-- KPI CARDS -->
      <div class="grid-3">

        <div class="card metric-card">
          <span class="metric-label">Open Tickets</span>
          <strong class="metric-value" id="stat-open">0</strong>
        </div>

        <div class="card metric-card">
          <span class="metric-label">In Progress</span>
          <strong class="metric-value" id="stat-progress">0</strong>
        </div>

        <div class="card metric-card">
          <span class="metric-label">Resolved (24h)</span>
          <strong class="metric-value" id="stat-resolved">0</strong>
        </div>

      </div>

      <!-- TABLE -->
      <div class="table-wrap">
        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Issue / Subject</th>
              <th>Priority</th>
              <th>Assigned To</th>
              <th>Status</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="ticketRows">
            <!-- dynamic -->
          </tbody>

        </table>
      </div>

    </div>
  </div>
</div>

<!-- ASSIGN MODAL -->
<div class="modal" id="assignModal">
  <div class="modal-panel">

    <div class="modal-head">
      <h3 class="section-title">Assign Ticket</h3>
      <button class="modal-close" id="assignCloseBtn">×</button>
    </div>

    <div class="modal-body stack">

      <div class="field">
        <label>Technician</label>
        <select id="assignTechnicianSelect"></select>
      </div>

      <div class="field">
        <label>Notes</label>
        <textarea id="assignNotes"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn secondary" id="assignCancelBtn">Cancel</button>
        <button class="btn" id="assignSubmitBtn">Assign</button>
      </div>

    </div>

  </div>
</div>

</body>
</html>
