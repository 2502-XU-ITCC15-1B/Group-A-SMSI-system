<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets</title>
  <link rel="stylesheet" href="../styles/global.css">
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="./common.js"></script>
  <script src="./tickets.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="../assets/logo.png" alt="SMSi">
        <div>
          <strong>SMSi</strong>
          <span id="portalLabel">technician portal</span>
        </div>
      </div>

      <nav>
        <a class="nav-item" data-nav="dashboard" href="/technician/dashboard.html">Dashboard</a>
        <a class="nav-item active" data-nav="tickets" href="/technician/tickets.html">Tickets</a>
        <a class="nav-item" data-nav="activity" href="/technician/activity.html">Activity</a>
        <a class="nav-item" data-nav="messages" href="/technician/messages.html">Inbox</a>
        <a class="nav-item" data-nav="profile" href="/technician/profile.html">Profile</a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-label">Signed in as</div>
        <div class="sidebar-user" id="sessionUserName">Loading...</div>
        <div class="sidebar-company" id="sessionUserMeta">Loading...</div>
        <button class="btn secondary sidebar-logout" id="technicianLogoutBtn" type="button" aria-label="Logout" onclick="window.technicianLogout?.(event)">Logout</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-meta">
          <nav class="breadcrumbs">
            <span class="crumb">Operations</span>
            <span class="crumb current">Tickets</span>
          </nav>
          <div>
            <h1 class="page-title" id="pageTitle">Tickets</h1>
            <p class="page-subtitle" id="pageSubtitle">Loading ticket list...</p>
          </div>
        </div>

        <div class="topbar-actions">
          <button class="btn secondary" id="refreshBtn" type="button">Refresh</button>
        </div>
      </header>

      <main class="content stack">
        <p id="ticketsMessage" class="form-msg" aria-live="polite"></p>

        <section class="card">
          <div class="admin-toolbar compact-toolbar">
            <div class="search-input">
              <input id="searchInput" type="search" placeholder="Search by ID, title, company, status">
            </div>
            <div class="field">
              <label for="statusFilter">Status</label>
              <select id="statusFilter">
                <option value="">All statuses</option>
              </select>
            </div>
            <div class="field">
              <label for="priorityFilter">Priority</label>
              <select id="priorityFilter">
                <option value="">All priorities</option>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>
        </section>

        <section class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Company</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="ticketRows">
              <tr><td colspan="8" class="table-empty">Loading...</td></tr>
            </tbody>
          </table>
        </section>

        <section class="pagination-line">
          <div class="pagination-info" id="paginationInfo">0 results</div>
          <div class="pagination">
            <button class="btn secondary" id="prevPageBtn" type="button">Previous</button>
            <button class="btn secondary" id="nextPageBtn" type="button">Next</button>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
