<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket Detail</title>
  <link rel="stylesheet" href="/styles/global.css">
</head>
<body>
  <div class="app-shell">
    <div data-client-sidebar></div>

    <div class="main">
      <div data-client-topbar></div>

      <main class="content stack">
        <section class="card stack">
          <div id="ticketDetail">
            <div class="empty-state">Loading ticket details...</div>
          </div>
        </section>

        <section class="card stack">
          <div>
            <h2 class="section-title">Conversation</h2>
            <p class="section-subtitle">Message history between your team and support.</p>
          </div>

          <div id="responsesList" class="responses-list">
            <div class="empty-state">Loading responses...</div>
          </div>
        </section>

        <section class="card stack">
          <div>
            <h2 class="section-title">Add Response</h2>
            <p class="section-subtitle">Reply to keep the support thread moving.</p>
          </div>

          <form id="responseForm" class="stack">
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" rows="6" required></textarea>
            </div>

            <div class="field">
              <label for="responseAttachment">Attachment (optional)</label>
              <input type="file" id="responseAttachment" name="attachment" accept="image/*,application/pdf">
            </div>

            <p id="responseMessage" class="form-msg" aria-live="polite"></p>

            <div class="form-actions">
              <button class="btn" id="responseSubmitBtn" type="submit">
                <svg class="ui-icon" aria-hidden="true"><use href="#ic-mail"></use></svg>Send Response
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/client.js"></script>
  <script src="/client/ticket-detail.js"></script>
</body>
</html>
