<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - SMSi</title>

<link rel="stylesheet" href="styles/global.css">
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/icons.js" defer></script>
</head>

<body>

<div class="auth-shell">

  <section class="auth-left">
    <div class="auth-brand">
      <h1>SMSi</h1>
      <p>Password recovery and account access</p>
    </div>
  </section>

  <section class="auth-right">
    <div class="auth-panel-card">

      <div class="auth-icon-badge">
        <svg class="ui-icon" aria-hidden="true"><use href="#ic-mail"></use></svg>
      </div>

      <h2 class="auth-title">Forgot Password</h2>
      <p class="auth-subtitle">
        Enter your email address and we will send you a reset link.
      </p>

      <form id="forgotForm">

        <div class="auth-field">
          <label class="auth-label">Email Address</label>
          <input class="auth-input" id="email" type="email" required>
        </div>

        <button class="auth-btn" type="submit">Send Reset Link</button>

        <div id="msg" class="auth-message"></div>
        <div id="resetLinkWrap" class="auth-footer" hidden>
          <a id="resetLink" class="auth-link" href="#">Open reset form</a>
        </div>

      </form>

      <div class="auth-footer">
        <a href="login.html" class="auth-link">Back to Login</a>
      </div>

    </div>
  </section>

</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const msg = document.getElementById('msg');
  const linkWrap = document.getElementById('resetLinkWrap');
  const button = e.submitter;

  msg.textContent = '';
  msg.style.color = '';
  linkWrap.hidden = true;
  button.disabled = true;
  button.textContent = 'Processing...';

  // Log the recovery request to backend
  try {
    await submitPasswordRecoveryRequest(email);
  } catch (err) {
    console.error('Failed to log recovery request:', err);
  }

  // Show account recovery notice
  setTimeout(() => {
    msg.innerHTML = `
      <div style="padding: 14px; border-radius: 6px; background: #f0f4f8; border-left: 4px solid #1f5fbf; color: #111827;">
        <strong>Account Recovery Notice</strong><br>
        <span style="font-size: 13px;">Automated email service is disabled for internal security. Please contact your System Administrator to perform a manual password override.</span>
      </div>
    `;
    msg.style.display = 'block';
    button.disabled = false;
    button.textContent = 'Send Reset Link';
  }, 500);
});
</script>

</body>
</html>
